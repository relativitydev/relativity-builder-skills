<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Unreviewed documents</title>
    <script src="lib/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div id="count"></div>
    <script>
        // aiR-ready page: bundled libraries, window.relativity values, native fetch.
        const kepler = window.relativity.getKeplerApplicationPath();
        fetch(kepler + "/relativity-object-manager/v1/workspace/1017123/object/query", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRF-Header": "-", "X-Kepler-Referrer": "contoso-unreviewed" },
            body: JSON.stringify({ request: { objectType: { artifactTypeID: 10 }, fields: [] }, start: 0, length: 1 })
        }).then(r => r.json()).then(r => {
            document.getElementById("count").innerText = r.TotalCount;
        });
    </script>
</body>
</html>
